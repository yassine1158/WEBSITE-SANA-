<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: 'Cairo', 'DejaVu Sans', sans-serif; color: #fff; position: relative;
    background: linear-gradient(180deg, #10183a 0%, #1a2552 45%, #232e5e 70%, #2b2f4a 100%);
  }
  .abs { position: absolute; }
  #vid { left: 0; top: 0; width: 1080px; height: 1920px; }
  #edge { left: 0; top: 924px; width: 1080px; height: 8px; background: #5ee6ff; box-shadow: 0 0 30px #5ee6ff; }
  #screen {
    left: 70px; top: 170px; width: 940px; height: 720px; border-radius: 40px;
    border: 14px solid #4b5788; background: #05081a; overflow: hidden;
    box-shadow: 0 0 60px rgba(94,230,255,.35), inset 0 0 40px rgba(94,230,255,.15);
  }
  #screen svg { width: 100%; height: 100%; }
  #label { left: 0; top: 70px; width: 100%; text-align: center; font-size: 40px; font-weight: 900; color: #5ee6ff; letter-spacing: 1px; text-shadow: 0 3px 10px rgba(0,0,0,.8); }
  .bubble {
    background: #fff; color: #1a1d33; border-radius: 34px; padding: 22px 34px; width: 760px;
    font-size: 46px; font-weight: 900; line-height: 1.45; text-align: center;
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
  }
  .bubble::after {
    content: ''; position: absolute; width: 0; height: 0;
    border-left: 24px solid transparent; border-right: 24px solid transparent;
  }
  .bubble.top::after { bottom: -34px; border-top: 36px solid #fff; }
  .bubble.bot::after { top: -34px; border-bottom: 36px solid #fff; }
  #bbip { background: #d8f8ff; }
  #bbip.top::after { border-top-color: #d8f8ff; }
  #bbip.bot::after { border-bottom-color: #d8f8ff; }
  /* Sami stands on the left of the clip, Bip floats on the right */
  #bsami { left: 50px; }
  #bsami::after { left: 150px; }
  #bbip { right: 50px; }
  #bbip::after { right: 130px; }
  #flash { left: 0; top: 0; width: 1080px; height: 1920px; background: #eaf2ff; mix-blend-mode: screen; }
  #dim { left: 0; top: 0; width: 1080px; height: 1920px; background: rgba(5,8,26,.78); }
  /* hook: on screen from the first frame (Shorts viewers decide to stay or swipe in ~1s) */
  #title { left: 40px; top: 150px; width: 1000px; text-align: center; text-shadow: 0 4px 16px rgba(0,0,0,.9); }
  #title .e { background: rgba(5,8,26,.82); border: 6px solid #ffd84a; border-radius: 40px; padding: 26px 30px;
              font-size: 74px; font-weight: 900; line-height: 1.3; color: #ffd84a; }
  #title .g { display: inline-block; margin-top: 26px; background: #ff5470; border-radius: 30px; padding: 14px 34px;
              font-size: 50px; font-weight: 900; }
  #end { left: 60px; top: 760px; width: 960px; text-align: center; }
  #end .a { font-size: 44px; color: #5ee6ff; font-weight: 700; }
  #end .b { font-size: 66px; font-weight: 900; line-height: 1.35; margin-top: 10px; }
  #end .c { font-size: 50px; color: #ffd84a; font-weight: 900; margin-top: 40px; }
</style>
</head>
<body>
  <canvas id="vid" class="abs" width="1080" height="1920"></canvas>
  <div id="edge" class="abs"></div>
  <div id="label" class="abs">🔬 مخبر سامي</div>

  <div id="screen" class="abs">
    <svg viewBox="0 0 900 700" id="scr" font-family="Cairo" font-weight="900">
      <defs>
        <g id="cloud">
          <ellipse cx="0" cy="0" rx="110" ry="50" fill="#4a5470"/>
          <ellipse cx="-70" cy="15" rx="70" ry="40" fill="#424b66"/>
          <ellipse cx="75" cy="18" rx="75" ry="38" fill="#3c4560"/>
          <ellipse cx="10" cy="-30" rx="70" ry="45" fill="#56607d"/>
        </g>
      </defs>
      <g id="stars"></g>
      <!-- storm: the flash comes first, the thunder two seconds later -->
      <g id="st">
        <rect width="900" height="700" fill="#0a0f26"/>
        <g id="rain"></g>
        <path id="stBolt" d="M560 170 L505 330 L560 330 L480 560 L620 290 L560 290 L610 170 z" fill="#fff6a8" stroke="#ffe066" stroke-width="6"/>
        <use href="#cloud" x="560" y="140"/>
        <use href="#cloud" x="270" y="110" transform="scale(.9)"/>
        <rect y="560" width="900" height="140" fill="#14301f"/>
        <rect x="150" y="430" width="190" height="130" fill="#3a3550"/>
        <path d="M130 435 L245 350 L360 435 z" fill="#5a2a3a"/>
        <rect x="185" y="465" width="54" height="50" fill="#ffd84a"/>
        <rect x="265" y="480" width="45" height="80" fill="#241f33"/>
        <rect id="stFlash" width="900" height="700" fill="#eef4ff"/>
        <text id="stCap1" x="700" y="640" text-anchor="middle" font-size="46" fill="#ffd84a">⚡ البرقة</text>
        <text id="stCap2" x="700" y="640" text-anchor="middle" font-size="46" fill="#ff7a8a">🔊 الرعد</text>
      </g>
      <!-- race: light arrives at once, sound takes its time -->
      <g id="rc">
        <use href="#cloud" x="150" y="150" transform="scale(.8) translate(37 37)"/>
        <path id="rcBolt" d="M150 200 L120 300 L155 300 L110 420 L195 270 L160 270 L185 200 z" fill="#fff6a8" stroke="#ffe066" stroke-width="5"/>
        <line id="rcBeam" x1="170" y1="360" x2="730" y2="360" stroke="#ffd84a" stroke-width="10" stroke-linecap="round"/>
        <g id="rcRings" fill="none" stroke="#ff5470" stroke-width="6" stroke-dasharray="14 10"></g>
        <text id="rcKid" x="790" y="400" text-anchor="middle" font-size="120">🧒</text>
        <text id="rcBoom" x="790" y="250" text-anchor="middle" font-size="64" fill="#ff5470">بُوم!</text>
        <text id="rcLight" x="450" y="80" text-anchor="middle" font-size="42" fill="#ffd84a">⚡ الضو: 300 ألف كم في الثانية</text>
        <text id="rcSound" x="450" y="650" text-anchor="middle" font-size="42" fill="#ff7a8a">🔊 الصوت: 340 متر في الثانية</text>
      </g>
      <!-- count the seconds, divide by 3 -->
      <g id="ct">
        <path id="ctBolt" d="M140 60 L110 160 L145 160 L100 280 L185 130 L150 130 L175 60 z" fill="#fff6a8" stroke="#ffe066" stroke-width="5"/>
        <text x="520" y="120" text-anchor="middle" font-size="56" fill="#5ee6ff">عدّ الثواني ⏱️</text>
        <text id="ctNum" x="450" y="430" text-anchor="middle" font-size="280" fill="#fff">1</text>
        <g id="ctRes">
          <text x="450" y="545" text-anchor="middle" font-size="70" fill="#ffd84a" direction="ltr">6 ÷ 3 = 2</text>
          <text x="450" y="635" text-anchor="middle" font-size="50" fill="#fff">العاصفة بعيدة 2 كيلومتر ⛈️</text>
        </g>
      </g>
    </svg>
  </div>

  <div id="bsami" class="abs bubble"></div>
  <div id="bbip" class="abs bubble"></div>
  <div id="flash" class="abs"></div>
  <div id="dim" class="abs"></div>
  <div id="end" class="abs">
    <div class="a">جرّبها في العاصفة الجاية ⛈️</div>
    <div class="b">الحلقة الجاية: كيفاش الصاروخ يخرج من الأرض؟ 🚀</div>
    <div class="c">أبّوني باش ما تفوتكش 🔔</div>
  </div>
  <div id="title" class="abs">
    <div class="e">⚡ علاش نشوفو البرق<br>قبل ما نسمعو الرعد؟</div>
    <div id="guess" class="g">خمّن قبل ما نقولك 👇</div>
  </div>

<script>
const LINES = [
  [3.5, 8.6, 'sami', 'بيب! البارح ما رقدتش… الرعد كان يدڨدڨ الشبابك!'],
  [8.6, 10.5, 'bip', 'بيب بوب؟ 🤖'],
  [10.5, 16.0, 'sami', 'ديما نشوف البرقة هي الأولى… ومن بعد يجي الرعد. علاش؟'],
  [16.0, 20.5, 'bip', 'خاطر يخرجو في نفس الوقت… أما الضو أسرع! ⚡'],
  [20.5, 24.5, 'sami', 'أسرع؟ قدّاش أسرع؟'],
  [24.5, 28.0, 'bip', 'الضو يقطع 300 ألف كيلومتر في الثانية'],
  [28.0, 31.5, 'bip', 'والصوت؟ 340 متر برك! 🐢'],
  [31.5, 37.0, 'bip', 'الضو يوصلك طول… والرعد يجي يمشي على مهلو'],
  [37.0, 43.0, 'bip', 'كي تشوف البرقة عدّ الثواني… وقسّم على 3: هذاكا البعد بالكيلومتر!'],
  [43.0, 47.5, 'sami', 'عدّيت 6… يعني العاصفة بعيدة 2 كيلومتر! 🤯'],
  [47.5, 50.0, 'bip', 'بيب بيب! ✅'],
  [50.0, 54.0, 'sami', 'بيب… الحلقة الجاية نطيّرو الصاروخ! 🚀'],
];
const TOTAL = 60;
// sound effects for audio.py: [time, kind]
const SFX = [
  [0.4, 'thunder'], [14.0, 'thunder'], [20.5, 'thunder'],
  [33.0, 'thunder'], [43.3, 'thunder'], [47.5, 'surprise'], [54.8, 'rumble'],
];
const FLASHES = [0.4, 12.0, 18.5, 24.8, 37.3]; // lightning on screen (the hook's flash lights up the whole frame)

// AI clips (gen_clips.py), 480x832 @16fps, extracted to clips/<name>/NNN.jpg
const FPS = 16, CW = 480, CH = 832;
const CLIPS = { intro: 81, shock: 65 };
// camera: [cx, cy, scale] = clip point at the centre of the view, screen px per clip px
const CAM = {
  full: [240, 416, 2.31], two: [240, 430, 2.75], sami: [150, 400, 3.5], bip: [330, 420, 3.5],
  rocket: [245, 500, 4.4],
  splitTwo: [240, 390, 2.25], splitSami: [150, 390, 2.8], splitBip: [330, 400, 2.8],
};
// [start, mode, clip, a, b, speed, loopFrom, cam0, cam1, moveIn]: plays a→b once, then ping-pongs loopFrom↔b
const SHOTS = [
  [0,    'full',  'shock', 2.4, 4.0, 0.8, 2.4, 'sami',     'two',      0],
  [3.5,  'full',  'intro', 0,   5.0, 1,   2.5, 'full',     'two',      0],
  [8.6,  'full',  'intro', 3.0, 5.0, 0.8, 3.0, 'bip',      'bip',      0],
  [10.5, 'split', 'intro', 1.0, 4.5, 1,   1.0, 'splitSami', 'splitTwo', 1],
  [16.0, 'split', 'intro', 2.5, 5.0, 0.8, 2.5, 'splitBip', 'splitBip', 0],
  [20.5, 'split', 'shock', 0.6, 4.0, 1,   2.6, 'splitTwo', 'splitSami', 0],
  [24.5, 'split', 'intro', 2.0, 5.0, 0.7, 2.0, 'splitBip', 'splitBip', 0],
  [31.5, 'split', 'intro', 0.5, 3.5, 0.7, 0.5, 'splitTwo', 'splitTwo', 0],
  [37.0, 'split', 'intro', 2.5, 5.0, 0.6, 2.5, 'splitBip', 'splitTwo', 0],
  [43.0, 'split', 'shock', 2.2, 4.0, 0.8, 2.4, 'splitTwo', 'splitSami', 0],
  [47.5, 'full',  'shock', 2.5, 4.0, 1,   2.5, 'two',      'bip',      1],
  [50.0, 'full',  'intro', 1.5, 5.0, 0.8, 2.5, 'sami',     'rocket',   0],
];
const SHOT_END = (i) => i + 1 < SHOTS.length ? SHOTS[i + 1][0] : TOTAL;
const DEST = { full: [0, 0, 1080, 1920], split: [0, 930, 1080, 990] };
const MOVE = 0.7;

const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const lerpA = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));
const typeDur = (l) => Math.min(l[1] - l[0] - 0.9, 0.3 + [...l[3]].length * 0.05);
const vis = (id, on) => { $(id).style.display = on ? '' : 'none'; };
// lightning: a bright flicker for ~0.35s after each flash time
const flashAt = (t, t0) => { const d = t - t0; return d < 0 || d > 0.35 ? 0 : (d < 0.08 || (d > 0.15 && d < 0.22) ? 1 : 0.35); };
const flash = t => Math.max(0, ...FLASHES.map(f => flashAt(t, f)));

const IMG = {};
window.ready = Promise.all(Object.entries(CLIPS).flatMap(([name, n]) => {
  IMG[name] = [];
  return Array.from({ length: n }, (_, i) => new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im); im.onerror = rej;
    im.src = `clips/${name}/${String(i + 1).padStart(3, '0')}.jpg`;
    IMG[name][i] = im;
  }));
}));

// deterministic stars and rain
const RAIN = [];
(function () {
  let s = 7, g = '';
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 90; i++) g += `<circle cx="${rnd() * 900}" cy="${rnd() * 700}" r="${0.8 + rnd() * 2.2}" fill="#fff" opacity="${0.3 + rnd() * 0.7}"/>`;
  $('stars').innerHTML = g;
  let r = '';
  for (let i = 0; i < 70; i++) {
    RAIN.push([rnd() * 940, rnd() * 700, 500 + rnd() * 300]);
    r += `<line id="rain${i}" x1="0" y1="0" x2="-8" y2="34" stroke="#8fb6ff" stroke-width="3" opacity=".5"/>`;
  }
  $('rain').innerHTML = r;
  let rings = '';
  for (let i = 0; i < 3; i++) rings += `<circle id="ring${i}" cx="170" cy="360"/>`;
  $('rcRings').innerHTML = rings;
})();

// where the camera of shot i is at time t: [dest rect, cam]
function shotView(i, t) {
  const s = SHOTS[i], k = smooth((t - s[0]) / (SHOT_END(i) - s[0]));
  return [DEST[s[1]], lerpA(CAM[s[7]], CAM[s[8]], k)];
}
function clipTime(s, t) {
  const [t0, , , a, b, speed, from] = s;
  const p = a + (t - t0) * speed;
  if (p <= b) return p;
  const L = b - from, q = (p - b) % (2 * L);
  return q < L ? b - q : from + (q - L);
}
const ctx = $('vid').getContext('2d');
ctx.imageSmoothingQuality = 'high';
function drawVideo(t) {
  const i = SHOTS.findLastIndex(s => t >= s[0]), s = SHOTS[i];
  let [dest, cam] = shotView(i, t);
  if (s[9] && i > 0) { // camera move from the previous shot (also morphs full <-> split)
    const k = smooth((t - s[0]) / MOVE), [d0, c0] = shotView(i - 1, s[0]);
    dest = lerpA(d0, dest, k); cam = lerpA(c0, cam, k);
  }
  const [dx, dy, dw, dh] = dest;
  const sw = Math.min(CW, dw / cam[2]), sh = Math.min(CH, dh / cam[2]);
  const sx = clamp(cam[0] - sw / 2, 0, CW - sw), sy = clamp(cam[1] - sh / 2, 0, CH - sh);
  const frames = IMG[s[2]], f = clamp(clipTime(s, t) * FPS, 0, frames.length - 1);
  const f0 = Math.floor(f), f1 = Math.min(f0 + 1, frames.length - 1);
  const k = 960 / CW; // extracted frames are 2x
  ctx.clearRect(0, 0, 1080, 1920);
  ctx.globalAlpha = 1;
  ctx.drawImage(frames[f0], sx * k, sy * k, sw * k, sh * k, dx, dy, dw, dh);
  ctx.globalAlpha = f - f0; // blend neighbours: 16fps clip -> smooth 30fps
  ctx.drawImage(frames[f1], sx * k, sy * k, sw * k, sh * k, dx, dy, dw, dh);
  ctx.globalAlpha = 1;
  return dy / 930; // 0 = full frame, 1 = split
}

function render(t) {
  const split = drawVideo(t);
  $('edge').style.opacity = split;
  $('screen').style.opacity = split;
  $('screen').style.transform = `translateY(${(1 - split) * -80}px) scale(${0.9 + 0.1 * split})`;
  $('label').style.opacity = t < 54 ? 1 : 0;
  const fl = flash(t);

  // ---- screen ----
  const mode = t < 24.5 ? 'st' : t < 37 ? 'rc' : 'ct';
  ['st', 'rc', 'ct'].forEach(m => vis(m, m === mode));
  vis('stars', mode !== 'st');
  if (mode === 'st') {
    RAIN.forEach(([x, y, v], i) => {
      const yy = (y + t * v) % 760 - 40, xx = (x - t * v * 0.25) % 940;
      $('rain' + i).setAttribute('transform', `translate(${xx < 0 ? xx + 940 : xx} ${yy})`);
    });
    $('stBolt').style.opacity = fl;
    $('stFlash').style.opacity = fl * 0.55;
    // captions: the flash, then two seconds later the thunder
    const cap = (t0) => t >= t0 && t < t0 + 1.6;
    $('stCap1').style.opacity = cap(12.0) || cap(18.5) ? 1 : 0;
    $('stCap2').style.opacity = cap(14.0) || cap(20.5) ? 1 : 0;
    $('scr').setAttribute('transform', cap(14.0) || cap(20.5) ? `translate(${Math.sin(t * 60) * 4} 0)` : '');
  } else $('scr').setAttribute('transform', '');
  if (mode === 'rc') {
    const t0 = 24.8, arrive = 33.0, dist = 560;
    $('rcBolt').style.opacity = t < t0 ? 0.25 : Math.max(0.6, fl);
    $('rcBeam').style.opacity = t < t0 ? 0 : (t < t0 + 0.6 ? 1 : 0.35);
    for (let i = 0; i < 3; i++) {
      const r = (t - t0 - i * 0.35) / (arrive - t0) * dist;
      const el = $('ring' + i);
      el.setAttribute('r', Math.max(0, r));
      el.style.opacity = r <= 0 || r > dist + 40 ? 0 : 1 - i * 0.25;
    }
    const boom = t >= arrive && t < arrive + 2;
    $('rcBoom').style.opacity = boom ? 1 : 0;
    $('rcKid').setAttribute('transform', boom ? `translate(${Math.sin(t * 50) * 6} 0)` : '');
    $('rcLight').style.opacity = ease((t - 24.5) / 0.4);
    $('rcSound').style.opacity = ease((t - 28) / 0.4);
  }
  if (mode === 'ct') {
    const t0 = 37.3;
    $('ctBolt').style.opacity = t < t0 ? 0.25 : Math.max(0.25, fl);
    const n = clamp(Math.floor(t - t0) + 1, 1, 6);
    $('ctNum').textContent = t < t0 ? '0' : n;
    $('ctNum').setAttribute('fill', t >= 43.3 ? '#ff5470' : '#fff');
    const pop = (t - t0) % 1;
    $('ctNum').setAttribute('transform', t >= t0 && t < 43.3 ? `translate(450 330) scale(${1 + 0.15 * (1 - ease(pop / 0.3))}) translate(-450 -330)` : '');
    $('ctRes').style.opacity = ease((t - 43.6) / 0.5);
  }

  // ---- bubbles: above the heads in full frame, under the screen in split ----
  ['sami', 'bip'].forEach(who => {
    const el = $(who === 'sami' ? 'bsami' : 'bbip');
    const l = LINES.find(l => l[2] === who && t >= l[0] && t < l[1]);
    if (!l) { el.style.opacity = 0; return; }
    const top = SHOTS.findLast(s => l[0] >= s[0])[1] === 'full';
    el.className = 'abs bubble ' + (top ? 'top' : 'bot');
    el.style.top = top ? '170px' : '';
    el.style.bottom = top ? '' : '50px';
    const chars = [...l[3]];
    const n = Math.ceil(chars.length * clamp((t - l[0]) / typeDur(l)));
    el.textContent = chars.slice(0, n).join('');
    const p = ease((t - l[0]) / 0.25);
    el.style.opacity = p;
    el.style.transform = `scale(${0.85 + 0.15 * p})`;
  });

  // ---- overlays ----
  $('flash').style.opacity = t < 3.5 ? fl * 0.6 : fl * 0.12; // the storm lights up the lab too
  $('title').style.opacity = t < 3.1 ? 1 : 1 - (t - 3.1) / 0.4; // full opacity on frame 0, no fade-in
  $('title').style.transform = t < 0.4 ? '' : `translateX(${fl ? Math.sin(t * 70) * 10 : 0}px)`; // shakes with the thunder
  $('guess').style.opacity = ease((t - 1.2) / 0.25);
  $('guess').style.transform = `scale(${0.6 + 0.4 * ease((t - 1.2) / 0.25)})`;
  $('dim').style.opacity = ease((t - 54) / 0.8);
  $('end').style.opacity = t >= 54.8 ? ease((t - 54.8) / 0.6) : 0;
}
window.TOTAL = TOTAL;
window.LINES = LINES;
</script>
</body>
</html>
