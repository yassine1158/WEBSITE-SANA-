<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: 'Cairo', 'DejaVu Sans', sans-serif; color: #fff; position: relative;
    background: linear-gradient(180deg, #10183a 0%, #1a2552 45%, #232e5e 70%, #2b2f4a 100%);
  }
  .abs { position: absolute; }
  /* lab wall details */
  #floor { left: 0; top: 1560px; width: 1080px; height: 360px; background: linear-gradient(180deg, #3a3550, #1e1b2c); }
  #floor::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: #5ee6ff; opacity: .5; }
  .pipe { background: #39456f; border-radius: 12px; }
  #screen {
    left: 70px; top: 170px; width: 940px; height: 720px; border-radius: 40px;
    border: 14px solid #4b5788; background: #05081a; overflow: hidden;
    box-shadow: 0 0 60px rgba(94,230,255,.35), inset 0 0 40px rgba(94,230,255,.15);
  }
  #screen svg { width: 100%; height: 100%; }
  #label { left: 0; top: 95px; width: 100%; text-align: center; font-size: 40px; font-weight: 900; color: #5ee6ff; letter-spacing: 1px; }
  .bubble {
    background: #fff; color: #1a1d33; border-radius: 34px; padding: 22px 34px;
    font-size: 46px; font-weight: 900; line-height: 1.45; text-align: center;
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
  }
  .bubble::after {
    content: ''; position: absolute; bottom: -34px; width: 0; height: 0;
    border-left: 24px solid transparent; border-right: 24px solid transparent; border-top: 36px solid #fff;
  }
  #bsami { left: 300px; top: 930px; width: 720px; }
  #bsami::after { right: 160px; }
  #bbip { left: 60px; top: 930px; width: 720px; background: #d8f8ff; }
  #bbip::after { left: 120px; border-top-color: #d8f8ff; }
  #sami { left: 590px; top: 1150px; width: 400px; height: 590px; }
  #bip { left: 110px; top: 1270px; width: 280px; height: 310px; }
  #title { left: 0; top: 0; width: 1080px; height: 1920px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(5,8,26,.88); text-align: center; }
  #title .s { font-size: 150px; font-weight: 900; color: #ffd84a; line-height: 1.1; }
  #title .e { font-size: 58px; font-weight: 900; margin-top: 30px; }
  #title .n { font-size: 44px; color: #5ee6ff; margin-top: 10px; font-weight: 700; }
  #end { left: 60px; top: 960px; width: 960px; text-align: center; }
  #end .a { font-size: 44px; color: #5ee6ff; font-weight: 700; }
  #end .b { font-size: 66px; font-weight: 900; line-height: 1.35; margin-top: 10px; }
  #end .c { font-size: 50px; color: #ffd84a; font-weight: 900; margin-top: 40px; }
</style>
</head>

          <path d="M-50 10 l-35 60 l35 -10 z M50 10 l35 60 l-35 -10 z" fill="#ff5470"/>

  <!-- Bip the robot -->

      <ellipse cx="124" cy="424" rx="28" ry="12" fill="#1a1a1a"/>

      <g id="armR"><rect x="204" y="232" width="34" height="110" rx="17" fill="#f5f7fb" stroke="#c9cfdc" stroke-width="4"/><circle cx="221" cy="346" r="17" fill="#d9a06e"/></g>
      <g id="head">

        <circle cx="67" cy="140" r="16" fill="#d9a06e"/>
        <circle cx="233" cy="140" r="16" fill="#d9a06e"/>
        <circle cx="150" cy="130" r="86" fill="#e3ad7c"/>
        <g fill="#1b1410">
          <circle cx="78" cy="96" r="20"/><circle cx="96" cy="74" r="22"/><circle cx="222" cy="96" r="20"/><circle cx="204" cy="74" r="22"/>
          <circle cx="70" cy="118" r="14"/><circle cx="230" cy="118" r="14"/>
        </g>
        <!-- chechia -->
        <path d="M86 70 q64 -26 128 0 l-12 -52 q-52 -18 -104 0 z" fill="#c8102e"/>
        <ellipse cx="150" cy="18" rx="52" ry="11" fill="#a50d26"/>
        <path d="M86 70 q64 -26 128 0" fill="none" stroke="#8f0b21" stroke-width="6"/>
        <!-- face -->
        <g id="brows" stroke="#1b1410" stroke-width="7" stroke-linecap="round">
          <line id="browL" x1="98" y1="100" x2="132" y2="96"/>

  <div id="bsami" class="abs bubble"></div>
  <div id="bbip" class="abs bubble"></div>
  <div id="end" class="abs">
    <div class="a">الحلقة الجاية</div>
    <div class="b">كيفاش الصاروخ يخرج من الأرض؟ 🚀</div>
    <div class="c">أبّوني باش ما تفوتكش 🔔</div>
  </div>
  <div id="title" class="abs">
    <div style="font-size:150px">🔬</div>
    <div class="s">مخبر سامي</div>
    <div class="e">علاش القمر ما يطيحش؟</div>
    <div class="n">الحلقة 1</div>
  </div>

<script>
const LINES = [
  [3.5, 8.0, 'sami', 'بيب! عندي سؤال ما خلّانيش نرقد البارح…'],
  [8.0, 10.5, 'bip', 'بيب بوب؟ 🤖'],
  [10.5, 16.0, 'sami', 'القمر تقيل برشا… علاش ما يطيحش علينا؟!'],
  [16.0, 21.0, 'bip', 'الحقيقة؟ القمر يطيح… ديما! 😱'],
  [21.0, 24.5, 'sami', 'شنوّة؟! كيفاش يطيح وما يوصلش؟'],
  [24.5, 28.0, 'bip', 'شوف المدفع: كي ترمي بالشوية… الكورة تطيح قريب'],
  [28.0, 31.5, 'bip', 'أسرع… تطيح أبعد'],
  [31.5, 37.0, 'bip', 'وكي تولّي سريعة برشا… الأرض تهرب من تحتها! تدور وما توصلش 🌍'],
  [37.0, 43.0, 'bip', 'القمر نفس الشي: يجري قريب 1 كيلومتر في الثانية… يطيح وهو يدور'],
  [43.0, 47.5, 'sami', 'يعني القمر يطيح من 4.5 مليار سنة… وما وصلش؟! 🤯'],
  [47.5, 50.0, 'bip', 'بيب بيب! ✅'],
  [50.0, 54.0, 'sami', 'بيب… حضّر الصاروخ! 🚀'],
];
const TOTAL = 60;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const typeDur = (l) => Math.min(l[1] - l[0] - 0.9, 0.3 + [...l[3]].length * 0.05);
const vis = (id, on) => { $(id).style.display = on ? '' : 'none'; };

// deterministic stars
(function () {
  let s = 7, g = '';
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 90; i++) g += `<circle cx="${rnd() * 900}" cy="${rnd() * 700}" r="${0.8 + rnd() * 2.2}" fill="#fff" opacity="${0.3 + rnd() * 0.7}"/>`;
  $('stars').innerHTML = g;
  let b = '';
  for (let i = 0; i < 8; i++) b += `<rect id="bar${i}" x="${190 + i * 68}" width="40" rx="8" fill="#5ee6ff" opacity=".7"/>`;
  $('bars').innerHTML = b;
})();

// Newton's cannon: integrate three shots once (center 450,400; ground r=150; launch r=205)
const C = { x: 450, y: 400 }, R0 = 205, GM = Math.pow(2 * Math.PI * R0 / 6, 2) * R0;
const VC = Math.sqrt(GM / R0);
const SHOTS = [0.45, 0.7, 1.0].map(f => {
  let x = 0, y = -R0, vx = f * VC, vy = 0, pts = [[x, y]];
  const dt = 0.004;
  for (let i = 0; i < 1600; i++) {
    const r = Math.hypot(x, y), a = -GM / (r * r * r);
    vx += a * x * dt; vy += a * y * dt; x += vx * dt; y += vy * dt;
    if (Math.hypot(x, y) < 150) break;
    pts.push([x, y]);
  }
  return pts.map(p => [C.x + p[0], C.y + p[1]]);
});

function talking(who, t) {
  for (const l of LINES) if (l[2] === who && t >= l[0] && t < l[0] + typeDur(l)) return true;
  return false;
}

function render(t) {
  // ---- screen ----
  const mode = t < 10.5 ? 'idle' : t < 24.5 ? 'em' : t < 37 ? 'cn' : t < 54 ? 'ob' : 'rk';
  ['idle', 'em', 'cn', 'ob', 'rk'].forEach(m => vis(m, m === mode));
  if (mode === 'idle') {
    let p = '';
    for (let x = 120; x <= 780; x += 10) p += `${x},${430 + Math.sin(x / 40 + t * 4) * 40 * Math.sin(x / 130)} `;
    $('wave').setAttribute('points', p);
    for (let i = 0; i < 8; i++) {
      const h = 40 + 70 * Math.abs(Math.sin(t * 2.3 + i * 1.7));
      $('bar' + i).setAttribute('y', 640 - h); $('bar' + i).setAttribute('height', h);
    }
  }
  if (mode === 'em') {
    const lt = t - 10.5;
    let mx = 660, my = 210 + Math.sin(t * 1.5) * 8;
    const shaking = t >= 16 && t < 21;
    if (shaking) mx += Math.sin(t * 40) * 6;
    $('emMoon').setAttribute('transform', `translate(${mx} ${my}) scale(${ease(lt / 0.6)})`);
    $('emQ').style.opacity = t < 16 ? (Math.floor(t * 2) % 2 ? 1 : 0.4) : 0;
    $('emArrow').setAttribute('transform', `translate(${mx} ${my + 100 + Math.sin(t * 6) * 10})`);
    $('emArrow').style.opacity = t >= 16 ? 1 : 0;
  }
  if (mode === 'cn') {
    const starts = [24.5, 28, 31.5], lens = [3.0, 3.0, 5.0];
    let ball = null, label = '';
    SHOTS.forEach((pts, i) => {
      const k = (t - starts[i]) / lens[i];
      const el = $('tr' + i);
      if (k < 0) { el.setAttribute('points', ''); return; }
      const n = Math.min(pts.length, Math.floor(clamp(k) * pts.length) + 1);
      el.setAttribute('points', pts.slice(0, n).map(p => p.join(',')).join(' '));
      el.style.opacity = t > starts[i] + lens[i] && i < 2 ? 0.45 : 1;
      if (k <= 1) { ball = pts[n - 1]; label = ['بالشوية 🐢', 'أسرع 🏃', 'سريعة برشا 🚀'][i]; }
    });
    if (ball) { $('ball').setAttribute('cx', ball[0]); $('ball').setAttribute('cy', ball[1]); $('ball').style.opacity = 1; }
    else $('ball').style.opacity = 0;
    $('cnTxt').textContent = label;
  }
  if (mode === 'ob') {
    const a = -Math.PI / 2 + (t - 37) * 0.55;
    const mx = 450 + 250 * Math.cos(a), my = 350 + 250 * Math.sin(a);
    $('obMoon').setAttribute('transform', `translate(${mx} ${my})`);
    const tang = a * 180 / Math.PI + 90, inward = a * 180 / Math.PI + 180;
    $('vArrow').setAttribute('transform', `translate(${mx} ${my}) rotate(${tang}) translate(40 0)`);
    $('gArrow').setAttribute('transform', `translate(${mx} ${my}) rotate(${inward}) translate(40 0)`);
    const show = t < 47.5 ? 1 : 0.25;
    ['vArrow', 'gArrow', 'obTxt1', 'obTxt2'].forEach(id => $(id).style.opacity = show);
  }
  if (mode === 'rk') {
    const lt = t - 54;
    const y = 520 - 520 * Math.pow(clamp((lt - 0.8) / 4), 2);
    $('rocket').setAttribute('transform', `translate(${450 + Math.sin(t * 30) * (lt > 0.8 ? 3 : 0)} ${y})`);
    $('flame').setAttribute('transform', `scale(1 ${1 + 0.35 * Math.sin(t * 40)})`);
  }

  // ---- Sami ----
  const sTalk = talking('sami', t);
  const bob = Math.sin(t * 2.2) * 4;
  $('samiBody').setAttribute('transform', `translate(0 ${bob})`);
  const surprised = (t >= 16 && t < 24.5) || (t >= 43 && t < 47.5);
  const blink = (t % 3.7) < 0.12;
  $('eyes').setAttribute('transform', blink ? 'translate(0 132) scale(1 0.1) translate(0 -132)' : '');
  const look = t >= 10.5 && t < 54 ? -6 : 0; // looks up/left at the screen while it explains
  ['pupL', 'pupR'].forEach(id => { $(id).setAttribute('transform', `translate(${look} ${look - 2})`); $(id).setAttribute('r', surprised ? 7 : 10); });
  $('browL').setAttribute('transform', surprised ? 'translate(0 -12)' : '');
  $('browR').setAttribute('transform', surprised ? 'translate(0 -12)' : '');
  const open = sTalk && Math.floor(t / 0.09) % 2 === 0;
  $('mouthO').style.display = open || (surprised && !sTalk) ? '' : 'none';
  $('mouthC').style.display = open || (surprised && !sTalk) ? 'none' : '';
  $('mouthO').setAttribute('ry', surprised && !sTalk ? 18 : 12);
  const raise = sTalk ? -35 + Math.sin(t * 6) * 8 : (surprised ? -120 : 0);
  $('armR').setAttribute('transform', `rotate(${raise} 221 240)`);
  $('armL').setAttribute('transform', surprised && !sTalk ? 'rotate(120 79 240)' : '');

  // ---- Bip ----
  const bTalk = talking('bip', t);
  const hover = Math.sin(t * 3) * 10;
  $('bipBody').setAttribute('transform', `translate(0 ${hover}) rotate(${Math.sin(t * 1.7) * 4} 100 110)`);
  $('bipShadow').setAttribute('rx', 60 - hover);
  const bBlink = (t % 2.9) < 0.12;
  $('bipEye').setAttribute('height', bBlink ? 4 : 30);
  $('bipEye').setAttribute('y', bBlink ? 91 : 78);
  $('bipLight').setAttribute('fill', bTalk ? (Math.floor(t * 8) % 2 ? '#5ee6ff' : '#ffd84a') : (Math.floor(t * 1.5) % 2 ? '#ff5470' : '#7a2430'));
  $('bipMouth').setAttribute('width', bTalk ? 20 + Math.abs(Math.sin(t * 25)) * 30 : 44);
  $('bipMouth').setAttribute('x', bTalk ? 100 - (10 + Math.abs(Math.sin(t * 25)) * 15) : 78);

  // ---- bubbles ----
  ['sami', 'bip'].forEach(who => {
    const el = $(who === 'sami' ? 'bsami' : 'bbip');
    const l = LINES.find(l => l[2] === who && t >= l[0] && t < l[1]);
    if (!l) { el.style.opacity = 0; return; }
    const chars = [...l[3]];
    const n = Math.ceil(chars.length * clamp((t - l[0]) / typeDur(l)));
    el.textContent = chars.slice(0, n).join('');
    const p = ease((t - l[0]) / 0.25);
    el.style.opacity = p;
    el.style.transform = `scale(${0.85 + 0.15 * p})`;
  });

  // ---- overlays ----
  const tp = t < 3.5 ? (t < 3 ? 1 : 1 - (t - 3) / 0.5) : 0;
  $('title').style.opacity = tp;
  $('title').style.transform = `scale(${0.9 + 0.1 * ease(t / 0.6)})`;
  const cp = 1 - ease((t - 54) / 0.5);
  $('sami').style.opacity = cp;
  $('bip').style.opacity = cp;
  const ep = ease((t - 54.8) / 0.6);
  $('end').style.opacity = t >= 54.8 ? ep : 0;
}
window.TOTAL = TOTAL;
window.LINES = LINES;
</script>
</body>
</html>
