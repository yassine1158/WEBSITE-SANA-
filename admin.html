<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>SANA — Administration</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/emblem-sana.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin locked">

<div class="lock" id="lock">
  <form class="lock-card" id="lockForm" novalidate>
    <img src="assets/img/logo-sana.svg" alt="SANA" width="110" height="72">
    <h1 id="lockTitle">Administration</h1>
    <p id="lockIntro"></p>
    <div id="lockFields"></div>
    <p class="lock-msg" id="lockMsg" role="alert"></p>
    <button class="btn btn-accent btn-block" type="submit" id="lockSubmit">Se connecter</button>
    <button type="button" class="lock-reset" id="lockReset">Mot de passe oublié ?</button>
    <a class="lock-back" href="index.html">← Retour au site</a>
  </form>
</div>

<header class="admin-bar">
  <a href="index.html" class="admin-brand" title="Voir le site">
    <img src="assets/img/logo-sana-white.svg" alt="SANA" width="74" height="48">
    <span>Administration</span>
  </a>
  <span class="status" id="status" role="status"></span>
  <div class="admin-actions">
    <a href="index.html" target="_blank" class="btn btn-line btn-sm" id="previewBtn">Aperçu du site</a>
    <button type="button" class="btn btn-accent btn-sm" data-act="publish">Publier</button>
    <button type="button" class="btn btn-line btn-sm" id="lockBtn" title="Verrouiller l'administration">Verrouiller</button>
  </div>
</header>

<div class="admin-layout">
  <nav class="admin-nav" id="adminNav" aria-label="Sections">
    <button type="button" data-tab="societe">Société &amp; contact</button>
    <button type="button" data-tab="accueil">Accueil</button>
    <button type="button" data-tab="poulets">Poulets</button>
    <button type="button" data-tab="oeufs">Œufs</button>
    <button type="button" data-tab="aliments">Aliments</button>
    <button type="button" data-tab="especes">Espèces &amp; formules</button>
    <button type="button" data-tab="matieres">Matières premières</button>
    <button type="button" data-tab="marketing">Marketing</button>
    <button type="button" data-tab="avis">Avis &amp; FAQ</button>
    <button type="button" data-tab="publication">Publication</button>
  </nav>

  <main class="admin-main">
    <div class="toast" id="toast" role="alert" hidden></div>
    <div id="panel"></div>
  </main>
</div>

<input type="file" id="importFile" accept=".js,.json,application/json,text/javascript" hidden>

<script>
  // Part toujours de la dernière version publiée
  (function () {
    var v = Math.floor(Date.now() / 60000);
    function load(src, next) { var s = document.createElement("script"); s.src = src + "?v=" + v; if (next) s.onload = next; document.body.appendChild(s); }
    load("data/content.js", function () { load("assets/js/admin.js"); });
  })();
</script>
</body>
</html>
